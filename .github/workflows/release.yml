name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish beta release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/dsh-mobile-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/dsh-mobile-${GITHUB_REF_NAME}-unsigned.apk"
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Mobile ${{ github.ref_name }} Beta
          body_path: docs/release-notes-0.2.0.md
          prerelease: true
          files: |
            android/release-assets/*.apk
            android/release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
